plugins {
    id 'com.android.application'
}

android {
    namespace 'il.mosad.grades'
    compileSdk 34

    defaultConfig {
        applicationId 'il.mosad.grades'
        // Android 4.1.2 (API 16) - המכשיר Galaxy GT-S6310
        minSdk 16
        targetSdk 19
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
